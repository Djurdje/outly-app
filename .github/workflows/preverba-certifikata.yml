# Tedenska preverba roka podpisnega certifikata za TestFlight (issue outly-backend#407).
#
# Zakaj: razvojni certifikat »Outly CI« (secrets IOS_DEV_CERT_P12 + IOS_DEV_CERT_PASSWORD, glej gradnja.yml) velja do ~20. 9. 2027. Ob poteku
# korak »Podpisan arhiv« pade, PR-ji pa ostanejo zeleni (Release prevod je brez podpisa) - tiha napaka. Novega certifikata Xcode na runnerju
# ne sme ustvariti sam (Applova omejitev, backend docs/INCIDENTI.md 20. 9. 2026), zato mora Martin pravocasno izdati nov .p12.
#
# Kaj: iz secretov prebere notAfter (OpenSSL 3, ob potrebi `-legacy` za stare .p12 s RC2/3DES) in ob < 45 dneh odpre issue z oznako `martin`
# (odprt issue z istim naslovom dobi komentar samo ob novem pragu 45/14/7/0 ali novem datumu poteka) in poslje ntfy, ce obstaja secret NTFY_TOPIC
# (sicer samo issue). Secreti so REPO secrets (gradnja.yml jih bere brez `environment:`), zato tu environment ni potreben.
#
# Repo je JAVEN: v dnevnik, issue in push gresta SAMO datum poteka in stevilo dni - nic drugega iz certifikata (ne subject, serial, ne gesla).
# Zacasne datoteke so v $RUNNER_TEMP in se pobrisejo (tudi ob napaki, trap EXIT). Manjkajoca secreta ali neberljiv .p12 = RDEC zagon (preverba
# sama ni uspela - to ni isto kot »certifikat je v redu«).
name: Preverba certifikata

on:
  schedule:
    - cron: "41 13 * * 3"   # sreda 13:41 UTC (izven 06-09 UTC; minuta ni 0/30)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  certifikat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preberi rok certifikata
        shell: bash
        env:
          CERT: ${{ secrets.IOS_DEV_CERT_P12 }}
          CERTPW: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          P12="$RUNNER_TEMP/preverba-cert.p12"
          PEM="$RUNNER_TEMP/preverba-cert.pem"
          TELO_FILE="$RUNNER_TEMP/preverba-telo.md"
          trap 'rm -f "$P12" "$PEM" "$TELO_FILE"' EXIT

          if [ -z "$CERT" ] || [ -z "$CERTPW" ]; then
            echo "::error::Secreta IOS_DEV_CERT_P12 / IOS_DEV_CERT_PASSWORD nista dostopna temu workflowu - roka certifikata ni mogoce preveriti."
            exit 1
          fi
          printf '%s' "$CERT" | base64 --decode > "$P12" 2>/dev/null || { echo "::error::IOS_DEV_CERT_P12 ni veljaven base64."; exit 1; }
          [ -s "$P12" ] || { echo "::error::IOS_DEV_CERT_P12 je prazen po dekodiranju."; exit 1; }

          # Geslo gre prek okolja (-passin env:), ne prek ukazne vrstice. Stderr gre v /dev/null (ne izpisuj nicesar o vsebini).
          if ! openssl pkcs12 -in "$P12" -passin env:CERTPW -nokeys -clcerts -out "$PEM" 2>/dev/null; then
            openssl pkcs12 -legacy -in "$P12" -passin env:CERTPW -nokeys -clcerts -out "$PEM" 2>/dev/null \
              || { echo "::error::.p12 ni mogoce odpreti (napacno geslo ali nepodprt format)."; exit 1; }
          fi
          ZAPIS=$(openssl x509 -in "$PEM" -noout -enddate 2>/dev/null) || ZAPIS=""
          KON="${ZAPIS#notAfter=}"
          DATUM=""
          [ -n "$KON" ] && DATUM=$(date -u -d "$KON" +%F 2>/dev/null)
          [[ "$DATUM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Iz certifikata ni mogoce prebrati datuma poteka."; exit 1; }

          DNI=$(( ($(date -u -d "$DATUM" +%s) - $(date -u +%s)) / 86400 ))
          echo "Certifikat poteče: $DATUM (čez $DNI dni)"
          if [ "$DNI" -ge 45 ]; then echo "OK  prag 45 dni ni dosezen."; exit 0; fi

          if   [ "$DNI" -lt 0 ];  then STOPNJA=0
          elif [ "$DNI" -le 7 ];  then STOPNJA=7
          elif [ "$DNI" -le 14 ]; then STOPNJA=14
          else STOPNJA=45; fi
          MARKER="prag-$STOPNJA-$DATUM"
          NASLOV="iOS certifikat za TestFlight poteče: nov .p12 v secrets"
          if [ "$DNI" -lt 0 ]; then OPIS="Podpisni certifikat je potekel **$DATUM** (pred $(( -DNI )) dnevi)."; else OPIS="Podpisni certifikat poteče **$DATUM** (čez **$DNI** dni; prag $STOPNJA)."; fi
          {
            echo "$OPIS"
            echo
            echo "Ko poteče, korak »Podpisan arhiv« v \`Gradnja iOS\` pade in novih TestFlight gradenj ni; PR-ji ostanejo zeleni (Release prevod je brez podpisa)."
            echo
            echo "**Martin:** izdaj nov razvojni certifikat (Apple Developer → Certificates), izvozi \`.p12\` in v GitHub secrets zamenjaj \`IOS_DEV_CERT_P12\`"
            echo "(base64) in \`IOS_DEV_CERT_PASSWORD\`. Postopek in past z omejitvijo certifikatov: \`CLAUDE.md\` tega repozitorija in backend \`docs/INCIDENTI.md\` (20. 9. 2026)."
            echo
            echo "Zagon: $RUN_URL"
            echo
            echo "<!-- $MARKER -->"
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > "$TELO_FILE"

          NOVO=0
          SEZNAM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label martin --limit 100 --json number,title) \
            || { echo "::error::Seznama odprtih issueov ni mogoce prebrati."; exit 1; }
          ST=$(jq -r --arg t "$NASLOV" '[.[] | select(.title == $t)][0].number // empty' <<<"$SEZNAM")
          if [ -z "$ST" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$NASLOV" --label martin --body-file "$TELO_FILE" >/dev/null \
              || { echo "::error::Issuea ni mogoce ustvariti."; exit 1; }
            echo "Issue ustvarjen."; NOVO=1
          else
            VSE=$(gh issue view "$ST" --repo "$GITHUB_REPOSITORY" --json body,comments --jq '[.body, (.comments[].body)] | join("\n")') || VSE=""
            if grep -qF -- "<!-- $MARKER -->" <<<"$VSE"; then
              echo "Ze objavljeno (#$ST, $MARKER) - nic novega."
            else
              gh issue comment "$ST" --repo "$GITHUB_REPOSITORY" --body-file "$TELO_FILE" >/dev/null \
                || { echo "::error::Komentarja na #$ST ni mogoce dodati."; exit 1; }
              echo "Komentar na #$ST ($MARKER)"; NOVO=1
            fi
          fi

          if [ "$NOVO" = 1 ]; then
            if [ -z "$TOPIC" ]; then echo "NTFY_TOPIC ni nastavljen - samo issue (push preskocen)."
            else
              curl -sS --max-time 20 \
                -H "Title: Outly iOS certifikat" \
                -H "Priority: high" \
                -H "Tags: key" \
                -H "Click: $RUN_URL" \
                -d "iOS certifikat za TestFlight poteče $DATUM (čez $DNI dni). Nov .p12 v GitHub secrets." \
                "https://ntfy.sh/$TOPIC" >/dev/null && echo "Push poslan." || echo "::warning::ntfy push ni uspel."
            fi
          fi
