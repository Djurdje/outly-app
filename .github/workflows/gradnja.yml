# Gradnja iOS aplikacije brez Maca: GitHub Actions na macOS runnerju.
#
# Ob vsakem potisku na master (in rocno prek "Run workflow"):
#   1. prevede projekt za simulator (brez podpisa) -> ce se ne prevede, je workflow
#      rdec in v dnevniku so napake prevajalnika; simulatorska .app gre kot artefakt
#      (appetize.io);
#   2. naredi PODPISAN arhiv in ga NALOZI NA TESTFLIGHT. Podpis: razvojni certifikat
#      (Apple Development) pride iz GitHub secrets IOS_DEV_CERT_P12 (base64 .p12) in
#      IOS_DEV_CERT_PASSWORD in se uvozi v zacasen keychain; profil in distribucijski
#      (cloud-managed) podpis uredi Xcode prek App Store Connect API kljuca
#      (APPLE_TEAM_ID, ASC_ISSUER_ID, ASC_KEY_ID, ASC_KEY_P8, -allowProvisioningUpdates).
#      Nic se ne hrani v repozitoriju.
#      Zakaj .p12 (20. 9. 2026): brez njega je Xcode na vsakem svezem runnerju ustvaril
#      NOV razvojni certifikat (zasebni kljuc ostane na runnerju in se izgubi), Apple pa
#      ima omejitev stevila certifikatov -> "maximum number of certificates" +
#      "No profiles for 'si.outly.app'". Glej outly-backend docs/INCIDENTI.md 2026-09-20.
#      Stevilka gradnje (CFBundleVersion) = stevilka zagona workflowa, zato je vsak
#      upload nov build. Verzija (1.0) je MARKETING_VERSION v projektu.
#
# Ce secrets manjkajo (fork, testna veja), se korak za TestFlight preskoci.
#
# Release prevod na pull requestu (2. 10. 2026): PR prevaja Debug (-Onone), arhiv za TestFlight
# pa Release (-O, whole-module). Napaka prevajalnika, ki se pokaze samo z optimizacijo, je prej
# prisla neopazena v master (Swift 6.3.3 EarlyPerfInliner, RokVrata<T>; outly-backend
# docs/INCIDENTI.md 2026-10-02, outly-app #45/#47). Zato na PR tece se drugi job
# "Release prevod (PR)": isti SDK (iphoneos) in ista konfiguracija (Release) kot arhiv, brez
# podpisa. Tece vzporedno z Debug jobom (cas PR-ja se ne podaljsa: Debug ~3,5 min, Release ~1 min).
# Poraba: GitHub zaokrozi vsak job navzgor na polno minuto, macOS stejejo 10x: Release ~2 min = +20 enot
# na zagon PR-ja (Debug ~4 min = 40). Debug job ostane nespremenjen, ker nosi teste
# (ENABLE_TESTABILITY, samo Debug) in simulatorski artefakt.
#
# Poraba: macOS-minute stejejo 10x; ena gradnja je ~8-10 min = 80-100 "minut" od
# 2000 brezplacnih na mesec za zasebni repo (~20 potiskov na mesec).
name: Gradnja iOS

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "_staro/**"
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**.md"
      - "_staro/**"

concurrency:
  group: gradnja-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradnja:
    name: Prevajanje in TestFlight
    # macos-26: Xcode 26 / iOS 26 SDK. Apple od aprila 2026 na TestFlight/App Store
    # sprejema samo gradnje z iOS 26 SDK (macos-15 ima Xcode 16.4 = iOS 18.5 SDK -> zavrnjeno).
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Xcode na runnerju
        # Privzeti Xcode runnerja: ima ujemajoc simulatorski runtime. Rocne izbire
        # druge razlicice NE delaj (runner nima ujemajocega simulatorja).
        run: |
          xcodebuild -version
          swift --version

      - name: Prevedi za simulator (brez podpisa)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project Outly.xcodeproj \
            -scheme Outly \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            -derivedDataPath build/sim \
            | tee build/sim.log \
            | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)|Compiling|Ld " || true
          grep -q "BUILD SUCCEEDED" build/sim.log

      - name: Testi (simulator)
        # OutlyTests (XCTest, brez UI/omreznih klicev) -- tece tudi na pull_request,
        # ker je to isti job kot zgornji korak. "generic/platform=iOS Simulator" (kot
        # zgoraj) za `test` ne velja -- xcodebuild zahteva konkreten simulator, zato ga
        # dobimo dinamicno (da se korak ne podre, ko runner spremeni privzeti seznam naprav).
        run: |
          set -o pipefail
          DEST_NAME=$(xcrun simctl list devices available | grep -m1 -oE '^ *iPhone [0-9A-Za-z ]+' | sed -e 's/^ *//' -e 's/ *$//')
          test -n "$DEST_NAME"
          echo "Simulator za teste: $DEST_NAME"
          xcodebuild test \
            -project Outly.xcodeproj \
            -scheme Outly \
            -destination "platform=iOS Simulator,name=$DEST_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/test.log \
            | grep -E "error:|Test Case|Test Suite|\*\* TEST (SUCCEEDED|FAILED) \*\*" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/test.log

      - name: Sestavi simulatorsko .app (za Appetize.io / simulator na Macu)
        run: |
          APP=$(find build/sim/Build/Products -name "Outly.app" -type d | head -1)
          test -n "$APP"
          (cd "$(dirname "$APP")" && zip -qr "$GITHUB_WORKSPACE/build/Outly-simulator.zip" Outly.app)
          ls -la build/Outly-simulator.zip

      - name: Prilozi simulatorsko .app
        uses: actions/upload-artifact@v4
        with:
          name: Outly-simulator-app
          path: build/Outly-simulator.zip
          retention-days: 14

      - name: Napake prevajalnika (povzetek)
        if: failure()
        run: |
          echo "::group::Vse napake"
          grep -E "error:" build/sim.log || true
          echo "::endgroup::"

      # ------------------------------------------------------------------
      # TestFlight
      # ------------------------------------------------------------------
      - name: So secrets za TestFlight?
        id: secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEYID: ${{ secrets.ASC_KEY_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          CERT: ${{ secrets.IOS_DEV_CERT_P12 }}
          CERTPW: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$ISSUER" ] || [ -z "$KEYID" ] || [ -z "$P8" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets APPLE_TEAM_ID / ASC_ISSUER_ID / ASC_KEY_ID / ASC_KEY_P8 manjkajo — TestFlight preskocen."
          elif [ -z "$CERT" ] || [ -z "$CERTPW" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets IOS_DEV_CERT_P12 / IOS_DEV_CERT_PASSWORD manjkajo — TestFlight preskocen (brez certifikata bi Xcode ustvaril novega in zadel Applovo omejitev)."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: App Store Connect API kljuc
        if: steps.secrets.outputs.ok == 'true' && github.event_name != 'pull_request'
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KEYID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$P8" > "$HOME/private_keys/AuthKey_${KEYID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${KEYID}.p8"
          # Kljuc mora biti veljaven PEM (prva vrstica BEGIN PRIVATE KEY)
          head -1 "$HOME/private_keys/AuthKey_${KEYID}.p8" | grep -q "BEGIN PRIVATE KEY"

      - name: Uvozi razvojni certifikat v zacasen keychain
        if: steps.secrets.outputs.ok == 'true' && github.event_name != 'pull_request'
        env:
          CERT: ${{ secrets.IOS_DEV_CERT_P12 }}
          CERTPW: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          set -e
          KC="$RUNNER_TEMP/outly-podpis.keychain-db"
          KCPW=$(openssl rand -hex 24)
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          test -s "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERTPW" -A -t cert -f pkcs12
          # Dovoli codesign/xcodebuild dostop do kljuca brez pogovornega okna.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" "$HOME/Library/Keychains/login.keychain-db"
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "Podpisne identitete v keychainu:"
          security find-identity -v -p codesigning "$KC"
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Development"

      - name: Podpisan arhiv
        if: steps.secrets.outputs.ok == 'true' && github.event_name != 'pull_request'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEYID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Outly.xcodeproj \
            -scheme Outly \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath build/Outly.xcarchive \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEYID}.p8" \
            -authenticationKeyID "$KEYID" \
            -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            | tee build/archive.log \
            | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)|Signing Identity|Provisioning Profile" || true
          grep -q "ARCHIVE SUCCEEDED" build/archive.log

      - name: Nalozi na TestFlight
        if: steps.secrets.outputs.ok == 'true' && github.event_name != 'pull_request'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEYID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Outly.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEYID}.p8" \
            -authenticationKeyID "$KEYID" \
            -authenticationKeyIssuerID "$ISSUER" \
            | tee build/export.log \
            | grep -E "error:|EXPORT (SUCCEEDED|FAILED)|Upload|upload" || true
          grep -q "EXPORT SUCCEEDED" build/export.log
          echo "Build $GITHUB_RUN_NUMBER nalozen na TestFlight (obdelava pri Applu traja ~5-15 min)."

      - name: Pocisti kljuc in keychain
        if: always()
        run: |
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/cert.p12"
          if [ -f "$RUNNER_TEMP/outly-podpis.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/outly-podpis.keychain-db" || true
          fi

      - name: Prilozi dnevnike
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnevniki-gradnje
          path: build/*.log
          retention-days: 7

  release-prevod:
    name: Release prevod (PR)
    # Samo na pull requestu: na masterju isto optimizacijo ze prevede korak "Podpisan arhiv".
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Xcode na runnerju
        run: |
          xcodebuild -version
          swift --version

      - name: Prevedi Release (iphoneos, brez podpisa)
        # Enaki build settings kot "Podpisan arhiv": -sdk iphoneos, -configuration Release
        # (project.pbxproj: SWIFT_COMPILATION_MODE = wholemodule, SWIFT_OPTIMIZATION_LEVEL
        # ni povozen -> privzeti -O). Podpis izklopljen, zato brez secrets in brez keychaina.
        # Ne podajaj SWIFT_OPTIMIZATION_LEVEL / SWIFT_COMPILATION_MODE tukaj: test bi se
        # razlikoval od arhiva.
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project Outly.xcodeproj \
            -scheme Outly \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build/release \
            | tee build/release.log \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)|Compiling|Ld " || true
          grep -q "BUILD SUCCEEDED" build/release.log

      - name: Preveri, da je bila res uporabljena optimizacija
        # Varovalo pred tihim padcem na -Onone (npr. nekdo doda SWIFT_OPTIMIZATION_LEVEL v Release):
        # brez tega bi zelena luc lagala. Gleda samo vrstice, ki prevajajo modul Outly
        # ("swiftc -module-name Outly ..."), in zahteva OBA stikala (-O in -whole-module-optimization)
        # na isti vrstici, in to na VSEH takih vrsticah (vsaj ena mora obstajati). Format vrstice je vzet iz dnevnika xcodebuild (dnevnik-release-prevoda).
        run: |
          VRSTICE=$(grep -E 'swiftc -module-name Outly ' build/release.log || true)
          if [ -z "$VRSTICE" ]; then
            echo "::error::V dnevniku ni vrstice prevajanja modula Outly (swiftc -module-name Outly) - format dnevnika se je spremenil?"
            exit 1
          fi
          SLABE=$(printf '%s\n' "$VRSTICE" | awk '!(/ -O / && / -whole-module-optimization/)')
          if [ -n "$SLABE" ]; then
            echo "::error::Vsaj ena vrstica prevajanja modula Outly nima hkrati -O in -whole-module-optimization:"
            printf '%s\n' "$SLABE" | cut -c1-300
            exit 1
          fi
          echo "Optimizacija potrjena (-O + -whole-module-optimization)."

      - name: Napake prevajalnika (povzetek)
        if: failure()
        run: |
          echo "::group::Vse napake"
          grep -E "error:|Stack dump|crashed|Please submit a bug report" build/release.log || true
          echo "::endgroup::"

      - name: Prilozi dnevnik
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dnevnik-release-prevoda
          path: build/release.log
          retention-days: 3
