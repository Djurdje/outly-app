# XcodeGen projekt SAMO za posnetke zaslona za App Store (workflow posnetki.yml).
# Ne vpliva na aplikacijo: UI test zazene ze namesceno Outly (si.outly.app) prek bundle ID.
name: Posnetki
options:
  bundleIdPrefix: si.outly.posnetki
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "YES"
    SWIFT_VERSION: "5.0"
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: si.outly.posnetki.host
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
  PosnetkiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PosnetkiUITests]
    dependencies:
      - target: Host
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: si.outly.posnetki.uitests
        TEST_TARGET_NAME: Host
schemes:
  Posnetki:
    build:
      targets:
        Host: all
        PosnetkiUITests: [test]
    test:
      targets: [PosnetkiUITests]
